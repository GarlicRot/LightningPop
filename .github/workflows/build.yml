name: Manual Plugin Build

on:
  workflow_dispatch:  # Manually triggered workflow

jobs:
  build:
    runs-on: ubuntu-24.04  # Use the latest Ubuntu version
    strategy:
      matrix:
        branch: [master, 2b]  # Define the branches to build
        java-version: [17, 21]  # Java versions corresponding to branches

    steps:
      - name: Check out repository
        uses: actions/checkout@v3
        with:
          ref: ${{ matrix.branch }}  # Check out the specific branch

      - name: Gradle Wrapper Verification
        uses: gradle/wrapper-validation-action@v1

      - name: Setup JDK
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Get and increment latest tag
        id: get_tag
        run: |
          # Fetch all tags
          git fetch --tags

          # Get the latest tag for the current branch
          latest_tag=$(git describe --tags `git rev-list --tags --max-count=1`)
          echo "Latest tag: $latest_tag"

          # Remove 'v' prefix and split version into parts
          version=${latest_tag#v}
          IFS='.' read -r major minor patch <<< "$version"

          # Increment patch version by 1
          new_patch=$((patch + 1))
          new_minor=$minor
          new_major=$major

          # Check if patch exceeds 9
          if [ "$new_patch" -gt 9 ]; then
            new_patch=0
            new_minor=$((minor + 1))
          fi

          # Check if minor exceeds 9
          if [ "$new_minor" -gt 9 ]; then
            new_minor=0
            new_major=$((major + 1))
          fi

          new_tag="v$new_major.$new_minor.$new_patch"
          new_version="$new_major.$new_minor.$new_patch"  # Version without 'v' prefix

          echo "New tag: $new_tag"

          # Save new_tag and new_version as environment variables
          echo "new_tag=$new_tag" >> $GITHUB_ENV
          echo "new_version=$new_version" >> $GITHUB_ENV

      - name: Update plugin_version in gradle.properties
        run: |
          sed -i "s/^plugin_version = .*/plugin_version = ${{
            env.new_version }}/" gradle.properties

      - name: Elevate wrapper permissions
        run: chmod +x ./gradlew

      - name: Build Plugin
        uses: gradle/gradle-build-action@v2
        with:
          arguments: build

      - name: Commit and push build artifact and updated gradle.properties
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # Commit and push to a temp-build branch for the release workflow
          git checkout -b temp-build
          git add -f build/libs/LightningPop-*.jar gradle.properties  # Force add gradle.properties
          git commit -m "Add build artifact and update version"
          git push --force https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }} temp-build

          # Commit and push updated gradle.properties to the original branch
          git checkout ${{ matrix.branch }}
          git merge temp-build --no-ff --commit --allow-unrelated-histories
          git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }} ${{ matrix.branch }}
